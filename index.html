<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 5 Science | Matter & Changes Revision</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#183047;background:#eef6ff}*{box-sizing:border-box}body{margin:0}.hero{background:linear-gradient(110deg,#005ba9,#14a9c7);color:white;padding:32px 20px;text-align:center}.hero h1{margin:5px 0;font-size:clamp(26px,5vw,42px)}.hero p{margin:7px}.wrap{max-width:880px;margin:25px auto;padding:0 16px}.card{background:white;border-radius:20px;padding:25px;box-shadow:0 8px 25px #1234;margin:18px 0}.tag{color:#0072b9;font-weight:800}.progress{background:#dce8f4;height:14px;border-radius:10px;overflow:hidden}.bar{background:#16ad85;height:100%;width:0;transition:.2s}button,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:13px 18px;font-weight:700}.choice{display:block;text-align:left;width:100%;background:#f1f6fb;margin:10px 0;border:2px solid transparent;color:#21384e}.choice:hover{border-color:#4bb3e8}.choice.selected{background:#d9efff;border-color:#168ac8}.choice.correct{background:#d9f7e6;border-color:#24a56d}.choice.wrong{background:#ffe2e2;border-color:#dc5757}.primary{background:#0075c9;color:white}.secondary{background:#e2edf6;color:#123f60}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.feedback{padding:14px;border-radius:12px;background:#e9f8ed;margin-top:15px}.muted{color:#5c6f80}.hide{display:none}textarea{width:100%;min-height:130px;border:2px solid #b9d4e5;border-radius:12px;padding:12px}footer{text-align:center;padding:22px;color:#617a8d}.pill{display:inline-block;background:#d7efff;color:#075989;padding:6px 12px;border-radius:99px;margin:4px}</style></head><body><header class="hero"><div>🔬 SCIENCE EXAM REVISION</div><h1>Grade 5 · Matter & Changes</h1><p>32 questions · 4 sections · Instant feedback</p><p>🧊 Solid &nbsp; 💧 Liquid &nbsp; 💨 Gas &nbsp; ⚗️ Changes</p></header><main class="wrap"><div class="card"><div id="counter"></div><div class="progress"><div class="bar" id="bar"></div></div><p class="muted" id="score"></p></div><div class="card" id="quiz"><div class="tag" id="section"></div><h2 id="question"></h2><div id="answers"></div><div id="feedback"></div><div class="actions"><button class="secondary" id="prev">← Previous</button><button class="primary" id="check">Check answer</button><button class="primary hide" id="next">Next →</button></div></div><div class="card hide" id="results"></div></main><footer>Grade 5 Science • Based on Matter & Changes Revision Worksheet • Works offline</footer><script>const questions=[{"type": "mc", "q": "Which state of matter has a definite shape and a definite volume?", "options": ["Solid", "Liquid", "Gas", "Energy"], "answer": 0}, {"type": "mc", "q": "What happens to the shape of a liquid when it is poured into a container?", "options": ["Maintains original shape.", "Takes shape of the container.", "Loses its volume.", "Expands rapidly."], "answer": 1}, {"type": "mc", "q": "Which of the following describes a physical change?", "options": ["Produces new matter", "Same kind of matter remains", "Destroys original matter", "Creates new atoms"], "answer": 1}, {"type": "mc", "q": "What does the law of conservation of mass state about matter?", "options": ["Created during physical change", "Destroyed during chemical change", "Neither created nor destroyed", "Loses weight over time"], "answer": 2}, {"type": "mc", "q": "The process of a solid turning into a liquid is called:", "options": ["Freezing", "Evaporating", "Condensing", "Melting"], "answer": 3}, {"type": "mc", "q": "When baking soda and vinegar are mixed, bubbles form. What does this indicate?", "options": ["A physical change", "Conservation of mass failed", "Gas in a chemical change", "Soap scum formation"], "answer": 2}, {"type": "mc", "q": "How are the particles arranged in a solid?", "options": ["Loosely packed together", "Very far apart", "Tightly packed together", "Moving rapidly in all directions"], "answer": 2}, {"type": "mc", "q": "A silver spoon turning dark grey over time (tarnish) is an example of:", "options": ["Conservation of mass failing", "A physical change in shape", "A chemical change in color", "Gas formation"], "answer": 2}, {"type": "mc", "q": "Freezing occurs when a liquid:", "options": ["Loses enough energy.", "Gains enough energy.", "Starts moving faster.", "Turns into a gas."], "answer": 0}, {"type": "mc", "q": "In which state of matter are particles the farthest apart?", "options": ["Solid", "Liquid", "Gas", "Equally spaced in all"], "answer": 2}, {"type": "tf", "q": "A physical change produces a completely new substance.", "options": ["True", "False"], "answer": 1}, {"type": "tf", "q": "Melting and evaporating are processes that happen when energy is added.", "options": ["True", "False"], "answer": 0}, {"type": "tf", "q": "Gases have no definite shape and no definite volume.", "options": ["True", "False"], "answer": 0}, {"type": "tf", "q": "Tearing a piece of paper is an example of a chemical change.", "options": ["True", "False"], "answer": 1}, {"type": "tf", "q": "When water freezes into ice, it is undergoing a physical change.", "options": ["True", "False"], "answer": 0}, {"type": "tf", "q": "In a liquid, particles can slide past one another.", "options": ["True", "False"], "answer": 0}, {"type": "tf", "q": "The law of conservation of mass states that matter can be destroyed.", "options": ["True", "False"], "answer": 1}, {"type": "tf", "q": "Rust forming on a metal pipe is evidence of a chemical change.", "options": ["True", "False"], "answer": 0}, {"type": "fill", "q": "Folding a piece of paper into an origami shape is an example of a _____ change.", "options": ["Temperature", "Gas", "Liquid", "Vibrate", "Energy", "Physical", "Chemical", "Mass"], "answer": 5}, {"type": "fill", "q": "A _____ change produces new matter with different properties.", "options": ["Temperature", "Gas", "Liquid", "Vibrate", "Energy", "Physical", "Chemical", "Mass"], "answer": 6}, {"type": "fill", "q": "The law of conservation of _____ applies to both physical and chemical changes.", "options": ["Temperature", "Gas", "Liquid", "Vibrate", "Energy", "Physical", "Chemical", "Mass"], "answer": 7}, {"type": "fill", "q": "In a solid, particles are tightly packed and mostly _____ in place.", "options": ["Temperature", "Gas", "Liquid", "Vibrate", "Energy", "Physical", "Chemical", "Mass"], "answer": 3}, {"type": "fill", "q": "When a _____ loses energy, its particles slow down to form a liquid during condensation.", "options": ["Temperature", "Gas", "Liquid", "Vibrate", "Energy", "Physical", "Chemical", "Mass"], "answer": 1}, {"type": "fill", "q": "A _____ takes the shape of its container from the bottom up.", "options": ["Temperature", "Gas", "Liquid", "Vibrate", "Energy", "Physical", "Chemical", "Mass"], "answer": 2}, {"type": "fill", "q": "Adding _____ to an object makes its particles move faster.", "options": ["Temperature", "Gas", "Liquid", "Vibrate", "Energy", "Physical", "Chemical", "Mass"], "answer": 4}, {"type": "fill", "q": "A measurement of the average movement of particles is called _____.", "options": ["Temperature", "Gas", "Liquid", "Vibrate", "Energy", "Physical", "Chemical", "Mass"], "answer": 0}, {"type": "short", "q": "Explain the difference between a physical change and a chemical change.", "model": "Physical change alters appearance but not chemical identity. Chemical change forms new substances."}, {"type": "short", "q": "What are the three states of matter? Give one example of each.", "model": "Solid (ice), liquid (water), gas (oxygen)."}, {"type": "short", "q": "Describe how particles are arranged in a solid, a liquid, and a gas.", "model": "Solid: tightly packed and vibrate. Liquid: close but slide past each other. Gas: far apart and move freely."}, {"type": "short", "q": "What happens to the particles in a liquid when it freezes?", "model": "Particles lose energy, slow down, and lock into a fixed pattern."}, {"type": "short", "q": "Why is mixing baking soda and vinegar considered a chemical change?", "model": "Gas (bubbles) is formed, indicating a new substance."}, {"type": "short", "q": "Briefly explain what the law of conservation of mass means.", "model": "Matter is neither created nor destroyed during physical or chemical changes."}];let pos=0;const responses=Array(questions.length).fill(null),checked=Array(questions.length).fill(false),points=Array(questions.length).fill(null);const el=id=>document.getElementById(id);const sectionNames=['Multiple Choice','True or False','Fill in the Blanks','Short Answer'];function render(){el('results').classList.add('hide');el('quiz').classList.remove('hide');const q=questions[pos];el('counter').textContent=`Question ${pos+1} of ${questions.length}`;el('bar').style.width=((pos+1)/questions.length*100)+'%';el('score').textContent=`Automatically marked: ${points.filter(x=>x!==null).length} / 26 · Correct: ${points.filter(x=>x===1).length}`;el('section').textContent=sectionNames[['mc','tf','fill','short'].indexOf(q.type)];el('question').textContent=q.q;el('answers').innerHTML='';el('feedback').innerHTML='';el('prev').disabled=pos===0;el('next').classList.add('hide');el('check').classList.remove('hide');if(q.type==='short'){let ta=document.createElement('textarea');ta.placeholder='Write your answer here before viewing the model answer...';ta.value=responses[pos]??'';ta.oninput=()=>responses[pos]=ta.value;el('answers').append(ta)}else{q.options.forEach((option,i)=>{let b=document.createElement('button');b.className='choice'+(responses[pos]===i?' selected':'');b.textContent=(q.type==='mc'?String.fromCharCode(65+i)+'. ':'')+option;b.onclick=()=>{if(checked[pos])return;responses[pos]=i;render()};el('answers').append(b)})}if(checked[pos])showFeedback();}function showFeedback(){const q=questions[pos];el('check').classList.add('hide');el('next').classList.remove('hide');el('next').textContent=pos===questions.length-1?'View results →':'Next →';if(q.type==='short'){el('feedback').innerHTML='<div class="feedback"><strong>Suggested answer:</strong><p></p><small>Compare your written answer with this model. Short answers are for self-review and are not automatically scored.</small></div>';el('feedback').querySelector('p').textContent=q.model}else{const opts=el('answers').querySelectorAll('button');opts.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');if(i===responses[pos]&&i!==q.answer)b.classList.add('wrong')});const ok=responses[pos]===q.answer;el('feedback').innerHTML='<div class="feedback"></div>';el('feedback').firstChild.textContent=(ok?'✅ Correct! ':'❌ Not quite. ')+ 'Correct answer: '+q.options[q.answer];}}el('check').onclick=()=>{const q=questions[pos];if(q.type!=='short'&&responses[pos]===null){alert('Choose an answer first.');return}checked[pos]=true;if(q.type!=='short')points[pos]=Number(responses[pos]===q.answer);render()};el('next').onclick=()=>{if(pos===questions.length-1){results()}else{pos++;render()}};el('prev').onclick=()=>{if(pos>0){pos--;render()}};function results(){el('quiz').classList.add('hide');el('results').classList.remove('hide');const total=points.filter(x=>x===1).length,answered=points.filter(x=>x!==null).length;el('results').innerHTML=`<h2>🎉 Revision complete!</h2><h1>${total} / 26</h1><p>Automatically marked questions correct. ${answered} of 26 objective questions checked.</p><p>6 written questions were for self-review using model answers.</p><div class="actions"><button class="primary" id="retry">Try again ↻</button><button class="secondary" id="review">Review questions</button></div>`;el('retry').onclick=()=>{responses.fill(null);checked.fill(false);points.fill(null);pos=0;render()};el('review').onclick=()=>{pos=0;render()}}render();</script></body></html>
